<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>josef hamelink — hlink.dev</title>
    <meta name="description" content="josef hamelink's corner of the internet. poke around the terminal." />
    <meta name="color-scheme" content="dark light" />
    <script>
      // set the theme before first paint so returning light-mode visitors
      // don't get a flash of dark
      (function () {
        var t = localStorage.getItem("hlink-theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <!-- the dock's terminal icon (dark variant — a favicon can't follow the theme) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'><rect width='34' height='34' rx='8' fill='%232a2c38'/><rect x='2.2' y='2.2' width='29.6' height='29.6' rx='5.8' fill='none' stroke='%2382aaff' stroke-width='1.4'/><path d='M8.5 10.5 L14 15 L8.5 19.5' stroke='%23d0d4e0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M16.5 19.5 H22.5' stroke='%23d0d4e0' stroke-width='2.6' stroke-linecap='round' fill='none'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
