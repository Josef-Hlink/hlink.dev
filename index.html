<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>josef hamelink — hlink.dev</title>
    <meta name="description" content="josef hamelink's corner of the internet. poke around the terminal." />
    <meta name="color-scheme" content="dark light" />
    <script>
      // set the theme before first paint so returning light-mode visitors
      // don't get a flash of dark
      (function () {
        var t = localStorage.getItem("hlink-theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <!-- the hlink mark, small cut; written by brand/mark.py -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
